<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SOLMAR HEAT — an open-world crime game</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #2b1a4e; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  #hud { position: fixed; inset: 0; pointer-events: none; color: #eef1f5; }
  #hud-top-left { position: absolute; top: 14px; left: 14px; }
  #hud-health { width: 220px; height: 18px; background: rgba(10,10,16,.6); border: 1px solid #4a4f5e; border-radius: 4px; overflow: hidden; position: relative; }
  #hud-health-fill { height: 100%; width: 100%; background: #39d98a; transition: width .15s; }
  #hud-health-text { position: absolute; inset: 0; text-align: center; font-size: 12px; line-height: 18px; font-weight: 700; }
  #hud-money { margin-top: 6px; font-size: 22px; font-weight: 800; text-shadow: 0 2px 6px #000; }
  #hud-top-right { position: absolute; top: 14px; right: 14px; text-align: right; }
  #hud-stars { font-size: 22px; letter-spacing: 2px; text-shadow: 0 2px 6px #000; }
  #hud-minimap { margin-top: 6px; border: 1px solid #4a4f5e; border-radius: 6px; background: #10131a; }
  #hud-banner { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); font-size: 18px; font-weight: 800; text-shadow: 0 2px 8px #000; color: #ffd166; text-align: center; max-width: 70vw; }
  #hud-mission { position: absolute; top: 72px; left: 50%; transform: translateX(-50%); font-size: 14px; text-shadow: 0 2px 6px #000; color: #eef1f5; text-align: center; max-width: 70vw; }
  #hud-msg { position: absolute; bottom: 90px; left: 50%; transform: translateX(-50%); font-size: 15px; font-weight: 700; text-shadow: 0 2px 6px #000; }
  #hud-crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); font-size: 22px; color: rgba(238,241,245,.85); text-shadow: 0 1px 4px #000; }
  #hud-screen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(16,10,32,.72); pointer-events: auto; text-align: center; padding: 20px; }
  #hud-title { font-size: 64px; margin: 0; letter-spacing: 4px; color: #ff2d78; text-shadow: 0 0 24px rgba(255,45,120,.6), 0 4px 0 #7c1038; }
  #hud-subtitle { font-size: 18px; color: #ffd166; margin: 8px 0 20px; }
  #hud-body { font-size: 16px; line-height: 1.6; max-width: 560px; color: #eef1f5; }
  #hud-button { margin-top: 26px; font-size: 20px; font-weight: 800; letter-spacing: 2px; padding: 14px 44px; border: none; border-radius: 8px; background: #ff2d78; color: #fff; cursor: pointer; box-shadow: 0 0 24px rgba(255,45,120,.55); }
  #hud-button:hover { background: #ff4d8d; }
  #hud-controls { margin-top: 22px; font-size: 13px; color: #9aa3b2; }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.min.js" } }
</script>
</head>
<body>
<canvas id="game" aria-label="Solmar Heat: an open-world crime game. Steal cars, outrun the police, finish five missions."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<div id="hud"></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
